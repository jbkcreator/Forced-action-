name: Deploy

# P0.2: tests gate every deploy. A pull request into dev runs the tests (and shows red when one fails);
# a push to dev deploys only after the same tests pass, so red code cannot reach production.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fa_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway CI services only. No production secret is used by this job.
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fa_ci_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fa_ci_unused
      REDIS_URL: redis://localhost:6379/0
      ANTHROPIC_API_KEY: ci-placeholder-not-a-key
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Prepare test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d fa_ci_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Run tests
        run: >-
          pytest tests/ -q -p no:cacheprovider
          -m "not scenario and not scenario_lifecycle and not scenario_platform and not scenario_chat and not integration"

  deploy:
    name: Deploy
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: bash /root/Forced-action-/deploy.sh
