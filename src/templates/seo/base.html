<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Forced Action{% endblock %}</title>
    <link rel="canonical" href="{{ canonical_url }}">
    {% if status == 'noindex' %}<meta name="robots" content="noindex">{% endif %}
    {% block head_extra %}{% endblock %}
    <style>
        body { font-family: system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 1rem 1.5rem; color: #1a1a1a; }
        h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
        h2 { font-size: 1.25rem; margin-top: 2rem; }
        .lead-prose { font-size: 1.05rem; line-height: 1.6; margin-bottom: 1.5rem; }
        .stat-cards { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0; }
        .stat-card { flex: 1 1 140px; border: 1px solid #e5e5e5; border-radius: 8px; padding: 1rem; text-align: center; }
        .stat-value { display: block; font-size: 1.75rem; font-weight: 700; }
        .stat-label { display: block; font-size: 0.8rem; color: #666; margin-top: 0.25rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 0.75rem; }
        th, td { padding: 0.5rem 0.75rem; border: 1px solid #e5e5e5; text-align: left; }
        th { background: #f5f5f5; }
        .faq-item { margin-bottom: 1.25rem; }
        .faq-item h3 { margin-bottom: 0.35rem; }
        .cta { background: #0f52ba; color: white; padding: 2rem; border-radius: 8px; text-align: center; margin-top: 2.5rem; }
        .cta h2, .cta p { color: white; margin: 0 0 0.75rem; }
        .cta-button { display: inline-block; background: white; color: #0f52ba; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
