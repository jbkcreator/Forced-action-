groups:
  - name: lifecycle_stage10_business_metrics
    interval: 60s
    rules:

      # ── First-payment rate ─────────────────────────────────────────────────
      # Fires when < 25% for 48 continuous hours.
      # Triggers: variant_engine.promote_winner("wallet_push_v1")
      - alert: LifecycleFirstPaymentRateLow
        expr: lifecycle_first_payment_rate < 25
        for: 48h
        labels:
          severity: critical
          team: revenue
        annotations:
          summary: "First-payment rate below 25% for 48h"
          description: >
            lifecycle_first_payment_rate = {{ $value | humanize }}%.
            Stage 10 self-healing will auto-pause the losing wallet_push_v1 variant
            and promote the winner. Incident logged in lifecycle_incident.

      # ── Lock conversion ────────────────────────────────────────────────────
      - alert: LifecycleLockConversionLow
        expr: lifecycle_lock_conversion < 3
        for: 48h
        labels:
          severity: warning
          team: revenue
        annotations:
          summary: "Lock conversion below 3% for 48h"
          description: >
            lifecycle_lock_conversion = {{ $value | humanize }}%.
            Self-healing will activate lock_close_use_fallback kill-switch flag.

      # ── Wallet adoption ────────────────────────────────────────────────────
      - alert: LifecycleWalletAdoptionLow
        expr: lifecycle_wallet_adoption < 10
        for: 48h
        labels:
          severity: warning
          team: revenue
        annotations:
          summary: "Wallet adoption below 10% for 48h"
          description: >
            lifecycle_wallet_adoption = {{ $value | humanize }}%.
            Self-healing will activate accelerated_wallet_push_paused fallback.

      # ── SMS reply rate ─────────────────────────────────────────────────────
      - alert: LifecycleSMSReplyRateLow
        expr: lifecycle_sms_reply_rate < 5
        for: 48h
        labels:
          severity: warning
          team: messaging
        annotations:
          summary: "SMS reply rate below 5% for 48h"
          description: >
            lifecycle_sms_reply_rate = {{ $value | humanize }}%.
            Self-healing will activate lifecycle_use_static_copy fallback.

      # ── Offer acceptance rate ──────────────────────────────────────────────
      - alert: LifecycleOfferAcceptanceRateLow
        expr: lifecycle_offer_acceptance_rate < 10
        for: 48h
        labels:
          severity: warning
          team: revenue
        annotations:
          summary: "Offer acceptance rate below 10% for 48h"
          description: >
            lifecycle_offer_acceptance_rate = {{ $value | humanize }}%.
            Self-healing will activate offer_use_baseline_template fallback.

  - name: lifecycle_stage10_variant_health
    interval: 60s
    rules:

      # ── Variant slot sigma rollback ────────────────────────────────────────
      # Fires when any slot's conversion rate drops more than 2σ below the
      # best active slot for the same sequence.
      # The alert_rules_check cron job evaluates this independently via
      # check_sigma_rollback(); this rule fires the Alertmanager webhook path.
      - alert: LifecycleVariantSigmaRollback
        expr: >
          (
            lifecycle_variant_conv_rate
              / on(sequence_name) group_left
            max by(sequence_name) (lifecycle_variant_conv_rate)
          ) < 0.3
          and lifecycle_variant_sends > 30
          and lifecycle_variant_slot_active == 1
        for: 0m
        labels:
          severity: warning
          team: messaging
        annotations:
          summary: "Variant slot conversion rate severely below best for {{ $labels.sequence_name }}"
          description: >
            Slot {{ $labels.slot }} of sequence {{ $labels.sequence_name }}
            has conv_rate {{ $value | humanize }}. Triggering sigma rollback check.

      # ── Variant sends stalled ──────────────────────────────────────────────
      # Fires when an active slot has had zero sends in the last 24h.
      - alert: LifecycleVariantSendsStalled
        expr: >
          increase(lifecycle_variant_sends[24h]) == 0
          and lifecycle_variant_slot_active == 1
        for: 0m
        labels:
          severity: info
          team: messaging
        annotations:
          summary: "Variant slot {{ $labels.slot }} of {{ $labels.sequence_name }} received no sends in 24h"
          description: >
            Check traffic_pct and sequence routing for {{ $labels.sequence_name }}.
