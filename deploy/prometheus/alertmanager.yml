global:
  resolve_timeout: 5m
  # Slack fallback (matches existing lifecycle_incident_slack_channel pattern)
  slack_api_url: "https://hooks.slack.com/services/REPLACE_ME"

route:
  group_by: ["alertname", "sequence_name"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h       # matches alert_cooldown_hours in settings.py
  receiver: "lifecycle_webhook"

  routes:
    # Critical alerts (first_payment_rate) fire immediately — no group wait
    - match:
        severity: critical
      group_wait: 0s
      receiver: "lifecycle_webhook_critical"

    # Info-level alerts only go to Slack, not the auto-action webhook
    - match:
        severity: info
      receiver: "slack_only"

receivers:
  # Primary: POST to FastAPI alert webhook (triggers auto-pause/promote)
  - name: "lifecycle_webhook"
    webhook_configs:
      - url: "http://localhost:8000/webhooks/alerts/prometheus"
        send_resolved: false
        http_config:
          authorization:
            credentials: "prom-wh-s3cr3t-fa-stage10"
        max_alerts: 10

  # Critical path: same webhook, zero retries (fire-and-forget with instant dispatch)
  - name: "lifecycle_webhook_critical"
    webhook_configs:
      - url: "http://localhost:8000/webhooks/alerts/prometheus"
        send_resolved: false
        http_config:
          authorization:
            credentials: "prom-wh-s3cr3t-fa-stage10"
        max_alerts: 5
    # Also send to Slack for human visibility
    slack_configs:
      - channel: "#lifecycle-incidents"
        title: "CRITICAL: {{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"

  # Info / stale-sends: Slack only, no auto-action
  - name: "slack_only"
    slack_configs:
      - channel: "#lifecycle-incidents"
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"

inhibit_rules:
  # Suppress warning if the same sequence also has a critical alert firing
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["sequence_name"]
